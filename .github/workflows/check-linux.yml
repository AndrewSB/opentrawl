name: check-linux
on:
  push:
  pull_request:
jobs:
  check-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: "**/go.sum"
      - run: scripts/check-linux
        env:
          CGO_ENABLED: "1"
          GOFLAGS: "-tags=sqlite_fts5"
