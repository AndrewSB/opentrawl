syntax = "proto3";

package trawl.source.contacts.open.v1;

option go_package = "github.com/opentrawl/opentrawl/trawlkit/proto/trawl/source/contacts/open/v1;contactsopenv1";

message ContactsRecord {
  string ref = 1;
  string name = 2;
  optional string sort_name = 3;
  repeated string aka = 4;
  repeated string tags = 5;
  repeated ContactValue emails = 6;
  repeated ContactValue phones = 7;
  repeated ContactValue addresses = 8;
  map<string, IdentifierList> accounts = 9;
  optional string annotation = 10;
  optional string annotation_stated_at = 11;

  // The contact card as the source states it, in the vCard vocabulary shared
  // by Apple Contacts, Google Contacts and CardDAV.
  optional string given_name = 12;
  optional string middle_name = 13;
  optional string family_name = 14;
  optional string previous_family_name = 15;
  optional string name_prefix = 16;
  optional string name_suffix = 17;
  optional string nickname = 18;
  optional string phonetic_given_name = 19;
  optional string phonetic_middle_name = 20;
  optional string phonetic_family_name = 21;
  optional string phonetic_organization_name = 22;
  optional string organization_name = 23;
  optional string department_name = 24;
  optional string job_title = 25;
  optional string birthday = 26;
  optional string note = 27;
  repeated ContactValue url_addresses = 28;
  repeated ContactValue social_profiles = 29;
  repeated ContactValue instant_message_addresses = 30;
  repeated ContactValue dates = 31;
  repeated ContactValue contact_relations = 32;
}

message ContactValue {
  string value = 1;
  optional string label = 2;
  optional bool primary = 3;
}

message IdentifierList {
  repeated string values = 1;
}
