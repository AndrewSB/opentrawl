version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bidichk
    - bodyclose
    - durationcheck
    - errcheck
    - fatcontext
    - forbidigo
    - gocheckcompilerdirectives
    - govet
    - ineffassign
    - makezero
    - nilnesserr
    - nolintlint
    - nosprintfhostport
    - reassign
    - staticcheck
    - unused
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        # Every word OpenTrawl shows is written by trawlkit/render. Code
        # anywhere else returns typed values and lets the library write them.
        - pattern: '^(fmt\.(Print|Fprint)(f|ln)?|print|println|io\.WriteString|os\.(Stdout|Stderr))$'
          msg: "only trawlkit/render writes output; return a typed value and let the library write it"
        - pattern: '^output\.HumanFacingErrorMessage$'
          msg: "word reader-facing failures with a trawlkit/render constructor"
        - pattern: '^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$'
          msg: "route diagnostics through trawlkit/log instead of the standard logger"
        - pattern: '^slog\.(Debug|DebugContext|Info|InfoContext|Warn|WarnContext|Error|ErrorContext)$'
          msg: "route diagnostics through trawlkit/log instead of the default slog logger"
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    rules:
    # The output library, the run log's diagnostics, the one entry point that
    # hands the process streams to the output library, and the trawler
    # process's protobuf wire streams.
    - path: '(^|/)(trawlkit/(render|log)/[^/]+\.go|trawl/cmd/trawl/main\.go|trawlkit/output/output\.go)$'
      linters:
        - forbidigo
